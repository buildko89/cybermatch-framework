name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly complete suite and evaluation menu (03:00 JST).
    - cron: "0 18 * * *"

permissions:
  contents: read

jobs:
  package-and-fast-tests:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install development environment
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps .

      - name: Check dependency consistency
        run: python -m pip check

      - name: Verify installed imports outside the checkout
        run: >-
          python -c "import os,tempfile; os.chdir(tempfile.gettempdir()); import cybermatch_core, cybermatch.agentic, cybermatch.loaders.scenario_loader, cybermatch.decision_model.decision_graph; print('installed imports: ok')"

      - name: Verify installed CLI outside the checkout
        run: python -c "import os,tempfile,subprocess; os.chdir(tempfile.gettempdir()); raise SystemExit(subprocess.run(['cybermatch-scenario', '--help']).returncode)"

      - name: Run smoke lane (60-second SLO)
        run: python scripts/run_tests.py --smoke

      - name: Run every non-slow test
        run: python scripts/run_tests.py --fast

      - name: Validate versioned repository assets
        run: cybermatch-validate-assets --root .

      - name: Run Agentic Resilience v2 evidence protocol
        run: python -m scripts.run_agentic_resilience --output-dir output/agentic-resilience-ci

      - name: Build wheel and source distribution
        run: python -m build --no-isolation

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-py312
          path: output/test-results/*.xml
          if-no-files-found: warn

      - name: Upload Agentic Resilience evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentic-resilience-${{ matrix.os }}-py312
          path: output/agentic-resilience-ci/*
          if-no-files-found: warn

      - name: Upload distributions
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-py312
          path: dist/*

  nightly-full:
    name: Nightly full suite and evaluation menu
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install development environment
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Run the complete test suite, including slow end-to-end tests
        run: python scripts/run_tests.py --full

      - name: Run every evaluation lane
        run: python scripts/evaluate.py all --run-id nightly

      - name: Upload test and evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-evidence
          path: |
            output/test-results/*.xml
            output/evaluations/nightly/
          if-no-files-found: warn

  core-only-install:
    name: Core-only boundary / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core only
        run: python -m pip install .

      - name: Verify optional packages stay optional
        run: >-
          python -c "import importlib.util,os,tempfile; os.chdir(tempfile.gettempdir()); import cybermatch_core, cybermatch_core.products, cybermatch.simulation.simulator; assert importlib.util.find_spec('sklearn') is None; assert importlib.util.find_spec('streamlit') is None; print('core-only boundary: ok')"

  agent-skills-linux-s4b:
    name: Agent Skills Linux / S4b No-Egress
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install fixed development environment
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Run native Agent Skills tests and evaluation on Linux
        run: |
          python -m pytest -q tests/test_agent_skills_native_mvp.py tests/test_native_manifest_snapshot.py tests/test_native_skill_loader.py
          python scripts/run_native_agent_skills_evaluation.py --output output/agent_skills/linux-native

      - name: Acquire the fixed external source outside the sandbox
        run: |
          mkdir -p tmp/s4b-source
          git -C tmp/s4b-source init
          git -C tmp/s4b-source remote add origin https://github.com/mukul975/Anthropic-Cybersecurity-Skills.git
          git -C tmp/s4b-source fetch --depth 1 origin 54a798831d2266a3ca61ce68a7acb80b81160d57
          git -C tmp/s4b-source checkout --detach FETCH_HEAD
          test "$(git -C tmp/s4b-source rev-parse HEAD)" = "54a798831d2266a3ca61ce68a7acb80b81160d57"

      - name: Review fixed external packages without executing scripts
        run: >-
          python scripts/review_external_agent_skills.py
          --source-root tmp/s4b-source
          --output output/agent_skills/s4b-review

      - name: Pull the worker image before closing network access
        run: docker pull python:3.12-slim

      - name: Probe No-Egress and read-only host boundaries
        run: |
          mkdir -p output/agent_skills/s4b-sandbox
          chmod 0777 output/agent_skills/s4b-sandbox
          docker run --rm --pull never \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --user 65532:65532 \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$GITHUB_WORKSPACE/tmp/s4b-source:/external:ro" \
            -v "$GITHUB_WORKSPACE/output/agent_skills/s4b-sandbox:/output:rw" \
            python:3.12-slim \
            python /repo/scripts/run_external_skill_sandbox_probe.py \
              --repository-root /repo --source-root /external \
              --manifest /repo/configs/agent_skills/external_review/s4b_external_candidates_v1.json \
              --output /output

      - name: Record the Linux execution evidence
        run: >-
          python scripts/record_linux_agent_skills_ci.py
          --native-metrics output/agent_skills/linux-native/metrics.json
          --external-review output/agent_skills/s4b-review/external_skill_review.json
          --sandbox-probe output/agent_skills/s4b-sandbox/sandbox_probe.json
          --output output/agent_skills/linux_execution_record.json

      - name: Upload Agent Skills Linux and S4b evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-skills-linux-s4b
          path: output/agent_skills/
          if-no-files-found: error
