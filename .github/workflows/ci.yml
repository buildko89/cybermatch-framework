name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-fast-tests:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install development environment
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps .

      - name: Check dependency consistency
        run: python -m pip check

      - name: Verify installed imports outside the checkout
        run: >-
          python -c "import os,tempfile; os.chdir(tempfile.gettempdir()); import cybermatch, cybermatch_core, src.cybermatch.agentic; print('installed imports: ok')"

      - name: Verify installed CLI outside the checkout
        run: python -c "import os,tempfile,subprocess; os.chdir(tempfile.gettempdir()); raise SystemExit(subprocess.run(['cybermatch-scenario', '--help']).returncode)"

      - name: Run fast validation lane
        run: python scripts/run_tests.py --smoke

      - name: Validate versioned repository assets
        run: cybermatch-validate-assets --root .

      - name: Run Agentic Resilience v2 evidence protocol
        run: cybermatch-agentic-benchmark --output-dir output/agentic-resilience-ci

      - name: Build wheel and source distribution
        run: python -m build --no-isolation

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-py312
          path: output/test-results/*.xml
          if-no-files-found: warn

      - name: Upload Agentic Resilience evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentic-resilience-${{ matrix.os }}-py312
          path: output/agentic-resilience-ci/*
          if-no-files-found: warn

      - name: Upload distributions
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-py312
          path: dist/*

  core-only-install:
    name: Core-only boundary / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core only
        run: python -m pip install .

      - name: Verify optional packages stay optional
        run: >-
          python -c "import importlib.util,os,tempfile; os.chdir(tempfile.gettempdir()); import cybermatch, cybermatch_core; assert importlib.util.find_spec('sklearn') is None; assert importlib.util.find_spec('streamlit') is None; print('core-only boundary: ok')"
